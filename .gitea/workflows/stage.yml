name: frontend-stage-pipeline

on:
  push:
    branches:
      - develop

jobs:
  deploy-stage:
    runs-on: frontend-stage
    steps:
      - name: Checkout
        run: |
          git clone http://gitea:3000/admin/spotfinder-frontend.git .
          git checkout ${{ gitea.sha }}

      - name: Show workspace
        run: |
          pwd
          ls -la

      - name: Check Docker
        run: |
          docker version
          docker compose version

      - name: Build frontend Docker image
        run: |
          docker build \
            --build-arg VITE_API_BASE_URL=http://stage-api.deployflow.ru \
            -t spotfinder-frontend:stage .

      - name: Prepare stage compose file
        run: |
          mkdir -p /opt/apps/spotfinder/stage/frontend
          cp docker-compose.stage.yml /opt/apps/spotfinder/stage/frontend/docker-compose.yml

      - name: Deploy frontend to stage
        run: |
          docker ps -a --format '{{.Names}}' \
            | grep 'spotfinder-stage-frontend' \
            | xargs -r docker rm -f || true

          docker compose \
            -f /opt/apps/spotfinder/stage/frontend/docker-compose.yml \
            -p spotfinder-stage-frontend \
            up -d --remove-orphans

      - name: Check frontend health
        run: |
          for i in $(seq 1 20); do
            if docker run --rm --network spotfinder-stage-net curlimages/curl:8.10.1 \
              -f http://spotfinder-stage-frontend/; then
              echo "Stage frontend is healthy"
              exit 0
            fi

            echo "Waiting for frontend... attempt $i"
            sleep 3
          done

          echo "Stage frontend healthcheck failed"
          docker logs spotfinder-stage-frontend --tail 100
          exit 1